# Windows build of the desktop maker (t_9b8f56f0): the maker and tools suites on Windows, the frozen sidecar, the NSIS
# installer and the portable .exe (unsigned), the desktop e2e against the packaged sidecar. Linux gates run locally.
name: windows
on:
  push:
    branches: [windows-build]
  workflow_dispatch:

# the token reads the repository only; actions are pinned to full commit SHAs (the tag each one was in a comment)
permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wasm:
    # the preview module (maker/static/wasm, git-ignored): emcc 6.0.13 as c/cross/install-toolchains.sh pins it
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Cache emsdk
        id: emsdk-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/emsdk
          key: emsdk-6.0.13-v1
      - name: Install emsdk 6.0.13
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 6.0.13 https://github.com/emscripten-core/emsdk.git ~/emsdk
          test "$(git -C ~/emsdk rev-parse HEAD)" = 35659964bc2762fffec0d257997fb61475f765b7
          ~/emsdk/emsdk install 6.0.13
          ~/emsdk/emsdk activate 6.0.13
      - name: Build the preview module
        run: EMSDK=$HOME/emsdk bash maker/build-wasm.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: wasm
          path: maker/static/wasm/
          retention-days: 3

  suites:
    # the maker suite in two shards and the tools suite with the desktop unit tests, in parallel; every skip is listed
    # with its reason (desktop/build/run-suite.py prints SUITE ... ran= skipped= and SKIP <n> <reason>)
    needs: wasm
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard:
          - { name: maker-a-l, dir: maker/test, pattern: "test_[a-l]*.py" }
          - { name: maker-m-z, dir: maker/test, pattern: "test_[m-z]*.py" }
          - { name: tools, dir: tools, pattern: "test_*.py" }
    name: suite ${{ matrix.shard.name }}
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: wasm
          path: maker/static/wasm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12.3"
          cache: pip
          cache-dependency-path: desktop/build/requirements-win.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Test dependencies (the pinned Pillow and fontTools)
        run: python -m pip install --require-hashes "--only-binary=:all:" --no-deps -r desktop/build/requirements-win.lock
      - name: Scratch directory
        run: |
          $t = Join-Path $env:RUNNER_TEMP "t"
          New-Item -ItemType Directory -Force $t | Out-Null
          "TMPDIR=$t" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "TMP_DIR=$t" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: FriBiDi for Pillow's raqm layout (pinned; on PATH)
        run: |
          $d = Join-Path $env:RUNNER_TEMP "fribidi"
          python desktop/build/fetch-fribidi-win.py $d
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $d | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "SVF_FRIBIDI_DIR=$d" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Pillow loads raqm
        run: python -c "from PIL import features; import sys; print('raqm', features.version('raqm'), 'fribidi', features.version('fribidi'), 'freetype', features.version('freetype2')); sys.exit(0 if features.check('raqm') else 1)"
      - name: Suite
        timeout-minutes: 45
        run: python desktop/build/run-suite.py ${{ matrix.shard.dir }} "${{ matrix.shard.pattern }}"
      - name: Desktop unit tests
        if: matrix.shard.name == 'tools' && !cancelled()
        timeout-minutes: 10
        working-directory: desktop
        run: node --test test/unit.test.js test/third-party.test.js

  package:
    # the frozen sidecar (its frozen test included), THIRD-PARTY.txt, the desktop e2e, the installer and the portable
    # .exe, the smoke of the unpacked, installed and portable app; the artifact svf-maker-windows
    needs: wasm
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: "1"
      SVF_DESKTOP_TMP: ${{ github.workspace }}\..\sdb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: wasm
          path: maker/static/wasm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12.3"
          cache: pip
          cache-dependency-path: desktop/build/requirements-win.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Test dependencies (the pinned Pillow and fontTools)
        run: python -m pip install --require-hashes "--only-binary=:all:" --no-deps -r desktop/build/requirements-win.lock
      - name: Scratch directory
        run: |
          $t = Join-Path $env:RUNNER_TEMP "t"
          New-Item -ItemType Directory -Force $t | Out-Null
          "TMPDIR=$t" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "TMP_DIR=$t" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: FriBiDi for Pillow's raqm layout (pinned; on PATH)
        run: |
          $d = Join-Path $env:RUNNER_TEMP "fribidi"
          python desktop/build/fetch-fribidi-win.py $d
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $d | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "SVF_FRIBIDI_DIR=$d" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Pillow loads raqm
        run: python -c "from PIL import features; import sys; print('raqm', features.version('raqm'), 'fribidi', features.version('fribidi'), 'freetype', features.version('freetype2')); sys.exit(0 if features.check('raqm') else 1)"
      - name: npm ci (Electron, electron-builder)
        working-directory: desktop
        run: |
          npm ci
          node node_modules/electron/install.js      # as on Linux: the binary even where install scripts are blocked
          if (-not (Test-Path node_modules/electron/dist/electron.exe)) { exit 1 }
      - name: Build the sidecar (frozen test included)
        timeout-minutes: 30
        run: python desktop/build/build-sidecar-win.py
      - name: THIRD-PARTY.txt (fail closed)
        run: |
          $lic = python -c "import os, sys; print(os.path.join(sys.base_prefix, 'LICENSE.txt'))"
          node desktop/build/third-party.mjs --platform win32 --sidecar desktop/build/out/sidecar/svf-maker-sidecar `
            --provenance desktop/build/out/sidecar-provenance.json --electron desktop/node_modules/electron/dist `
            --pysite "$env:SVF_DESKTOP_TMP\pysite" --repo desktop/build/out/repo --meta . --python-licence $lic `
            --out desktop/build/out/THIRD-PARTY.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Desktop e2e (development pass, then the packaged sidecar)
        id: e2e
        continue-on-error: true            # the packages are still built and smoked; the last step fails the job
        timeout-minutes: 25
        working-directory: desktop
        env:
          SVF_MAKER_SIDECAR: ${{ github.workspace }}\desktop\build\out\sidecar\svf-maker-sidecar\svf-maker-sidecar.exe
          SVF_MAKER_STAGED_REPO: ${{ github.workspace }}\desktop\build\out\repo
        run: |
          $env:TMP_DIR = Join-Path $env:RUNNER_TEMP "e2e"
          New-Item -ItemType Directory -Force $env:TMP_DIR | Out-Null
          $env:TMPDIR = $env:TMP_DIR
          & node_modules\electron\dist\electron.exe --disable-gpu "--user-data-dir=$env:TMP_DIR\e2e-base" test/e2e.js 2>&1 | Out-Host
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Installer and portable (electron-builder, unsigned)
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npx electron-builder --win nsis portable --x64 --publish never
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem dist -File | Format-Table Name, Length
      - name: Smoke (unpacked, installed, portable)
        timeout-minutes: 10
        run: python desktop/build/smoke-win.py desktop/dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: svf-maker-windows
          path: |
            desktop/dist/*.exe
            desktop/build/out/THIRD-PARTY.txt
          if-no-files-found: error
          retention-days: 14
      - name: The e2e passed
        if: steps.e2e.outcome != 'success'
        run: |
          echo "desktop e2e: ${{ steps.e2e.outcome }}"
          Get-ChildItem -Recurse (Join-Path $env:RUNNER_TEMP "e2e") -Filter shell.log -ErrorAction SilentlyContinue | ForEach-Object { "==== " + $_.FullName; Get-Content $_.FullName -Tail 80 }
          exit 1
